<!DOCTYPE html>

<html lang="en">

<head>

    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NDS Project Generator</title>

    <link rel="stylesheet" href="styles.css">
    

</head>

<body>

    
    <main class="container">

        <h1>Project Generator</h1>


        <!-- Project Name -->
        <div class="form-group">

            <label for="projectName">
                Project Name
            </label>

            <input id="projectName" type="text" placeholder="Nova Starter">

        </div>


        <!-- Template Selection -->
        <div class="form-group">

            <label for="template">
                Template
            </label>

            <select id="template">
                <!-- Templates populated dynamically -->
            </select>

        </div>


        <!-- Output Location -->
        <div class="form-group">

            <label for="outputPath">
                Output Location
            </label>

            <input id="outputPath" type="text" placeholder="Leave blank for default output folder">

            <small>
                Optional. Leave blank to use the default output folder.
            </small>

        </div>


        <!-- Generate Project -->
        <button id="generateBtn">
            Generate Project
        </button>


        <!-- API Response -->
        <pre id="response"></pre>

    </main>


    <!-- Configuration -->
    <script src="config/config.js"></script>

    <!-- API -->
    <script src="js/api.js"></script>

    <!-- UI -->
    <script src="js/ui.js"></script>

    <!-- Application -->
    <script src="js/app.js"></script>
    

</body>

</html>
